<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">Residual block diagram</title><desc id="desc">Input splits into a learned residual path and an identity shortcut, then the paths are added.</desc>
  <rect width="900" height="320" rx="24" fill="#f4f1e8"/>
  <g font-family="Inter,system-ui,sans-serif" fill="#17211f" stroke="#1d6157" stroke-width="4">
    <rect x="60" y="130" width="110" height="60" rx="12" fill="#fff"/><text x="115" y="167" text-anchor="middle" stroke="none" font-size="22">Input x</text>
    <path d="M170 160H245"/><path d="M190 160V55H680V130" fill="none"/><text x="430" y="42" text-anchor="middle" stroke="none" font-size="18">identity shortcut</text>
    <rect x="245" y="115" width="180" height="90" rx="14" fill="#dbece6"/><text x="335" y="151" text-anchor="middle" stroke="none" font-size="19">Conv · Norm · ReLU</text><text x="335" y="180" text-anchor="middle" stroke="none" font-size="18">Conv · Norm</text>
    <path d="M425 160H650"/><circle cx="700" cy="160" r="38" fill="#fff"/><text x="700" y="170" text-anchor="middle" stroke="none" font-size="32">+</text>
    <path d="M738 160H820"/><text x="780" y="145" text-anchor="middle" stroke="none" font-size="18">F(x) + x</text>
  </g>
</svg>
